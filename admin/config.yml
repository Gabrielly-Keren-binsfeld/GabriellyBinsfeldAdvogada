backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "artigos"
    label: "Artigos Jurídicos"
    folder: "_artigos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Categoria", name: "category", widget: "string", default: "INSS"}
      - {label: "Data de Publicação", name: "date", widget: "datetime"}
      - {label: "Imagem de Capa", name: "image", widget: "image"}
      - {label: "Resumo Simples", name: "summary", widget: "text"}
      - {label: "Conteúdo Completo", name: "body", widget: "markdown"}
