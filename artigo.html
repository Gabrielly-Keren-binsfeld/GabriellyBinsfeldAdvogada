<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artigos | Dra. Gabrielly Binsfeld</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        .blog-header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1589829545856-d10d557cf95f?q=80&w=2070');
            background-size: cover; background-position: center;
        }
    </style>
</head>
<body class="bg-slate-50 antialiased">
    <header class="bg-white border-b py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <a href="index.html" class="font-serif text-xl font-bold text-stone-800">Dra. Gabrielly Binsfeld</a>
        <a href="index.html" class="text-sm text-stone-500 hover:underline">Voltar ao Início</a>
    </header>

    <section class="blog-header py-24 text-center text-white">
        <h1 class="font-serif text-5xl font-bold mb-4">Artigos</h1>
        <div class="w-20 h-1 bg-yellow-600 mx-auto"></div>
    </section>

    <main class="max-w-7xl mx-auto px-4 py-12 flex flex-col md:flex-row gap-8">
        <div id="lista-artigos" class="flex-1 grid md:grid-cols-2 gap-8">
            <p class="text-center col-span-full py-10">Carregando informativos...</p>
        </div>
        <aside class="w-full md:w-80">
            <div class="bg-white p-6 rounded-xl border sticky top-24">
                <h3 class="font-bold mb-4 border-b pb-2">Pesquisar</h3>
                <input type="text" id="busca" placeholder="O que você procura?" class="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-stone-400">
            </div>
        </aside>
    </main>

    <script>
        (async function () {
            const container = document.getElementById('lista-artigos');
            let todos = [];
            const r = await fetch(`https://api.github.com/repos/Gabrielly-Keren-binsfeld/GabriellyBinsfeldAdvogada/contents/content/artigos`);
            const arquivos = await r.json();
            for (let f of arquivos) {
                if (!f.name.endsWith('.md')) continue;
                const res = await fetch(f.download_url);
                const texto = await res.text();
                if (texto.includes('categoria: avalia')) continue;
                const title = texto.match(/title:\s*"(.*)"/)?.[1] || f.name;
                const desc = texto.match(/description:\s*"(.*)"/)?.[1] || "Leia mais...";
                const img = texto.match(/imagem:\s*"(.*)"/)?.[1] || "https://images.unsplash.com/photo-1450101499163-c8848c66ca85?w=800";
                todos.push({ title, desc, img, path: f.path });
            }
            function render(l) {
                container.innerHTML = l.map(a => `
                    <article class="bg-white border rounded-xl overflow-hidden shadow-sm flex flex-col">
                        <img src="${a.img}" class="h-48 w-full object-cover">
                        <div class="p-6 flex-1 flex flex-col">
                            <h2 class="font-serif text-xl font-bold mb-3">${a.title}</h2>
                            <p class="text-stone-600 text-sm mb-6 flex-1">${a.desc}</p>
                            <a href="artigo.html?f=${encodeURIComponent(a.path)}" class="font-bold text-xs uppercase tracking-widest hover:underline">LEIA MAIS >></a>
                        </div>
                    </article>
                `).join('');
            }
            render(todos);
            document.getElementById('busca').oninput = (e) => {
                const t = e.target.value.toLowerCase();
                render(todos.filter(a => a.title.toLowerCase().includes(t)));
            };
        })();
    </script>
</body>
</html>
````_
