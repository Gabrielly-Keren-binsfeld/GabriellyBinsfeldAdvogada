backend:
  name: github
  repo: josiasdasilveira/Gabrielly-Binsfeld-Advogada
  branch: principal
  token: "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"

media_folder: "imagens"
public_folder: "/imagens"

collections:
  - name: "artigos"
    label: "Artigos Jurídicos"
    folder: "content/artigos"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Categoria", name: "categoria", widget: "string"}
      - {label: "Descrição", name: "description", widget: "text"}
      - {label: "Corpo do Artigo", name: "body", widget: "markdown"}
